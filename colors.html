<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8">
  <title>Choose a color — Triablo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    .color-page { min-height: 100vh; padding: 35px 0 70px; }
    .color-top { display: flex; justify-content: space-between; align-items: center; }
    .color-main { max-width: 760px; margin: 76px auto 0; text-align: center; }
    .color-main h1 { margin: 0 0 14px; font: 700 clamp(38px, 6vw, 58px)/1.08 var(--font-display); letter-spacing: -3px; }
    .color-main > p:not(.eyebrow) { max-width: 460px; margin: 0 auto; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .color-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin: 43px 0 30px; }
    .color-option { display: flex; min-height: 145px; flex-direction: column; align-items: center; justify-content: center; gap: 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--surface); cursor: pointer; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .color-option:hover { transform: translateY(-4px); }
    .color-option[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
    .color-swatch { width: 45px; height: 45px; border: 1px solid rgba(0,0,0,.08); border-radius: 50%; background: var(--swatch); }
    .color-name { font-size: 11px; font-weight: 700; }
    .color-status { min-height: 20px; margin-bottom: 16px; color: var(--muted); font-size: 12px; }
    .color-actions { display: flex; justify-content: center; gap: 12px; }
    .color-name small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 500; }
    @media (max-width: 767.98px) {
      .color-page { padding-top: 23px; }
      .color-main { margin-top: 55px; }
      .color-options { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .color-option { min-height: 120px; }
    }
    @media (max-width: 400px) {
      .color-options { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="color-page container">
    <div class="color-top">
      <a class="brand" href="index.html"><img src="images/triablo-logo.png" alt="" width="38" height="38"><span>triablo<span class="brand-period">.</span></span></a>
      <a class="nav-link" href="index.html">← Back to showcase</a>
    </div>
    <section class="color-main" aria-labelledby="color-title">
      <p class="eyebrow">MAKE IT YOURS</p>
      <h1 id="color-title">Choose your <span style="color:#969a92">accent.</span></h1>
      <p>Each accent opens its own storefront demo. Choose a color to jump straight in.</p>
      <div class="color-options" role="group" aria-label="Choose an accent color">
        <button class="color-option" type="button" data-color="#dc2d3e" data-page="countdown.html" aria-label="Open Countdown demo with red accent"><span class="color-swatch" style="--swatch:#dc2d3e"></span><span class="color-name">Red<small>Countdown</small></span></button>
        <button class="color-option" type="button" data-color="#42c3d6" data-page="images/slider.html" aria-label="Open Product slider demo with sky blue accent"><span class="color-swatch" style="--swatch:#42c3d6"></span><span class="color-name">Sky blue<small>Product slider</small></span></button>
        <button class="color-option" type="button" data-color="#a1cf4e" data-page="images/slider parallax.html" aria-label="Open Slider parallax demo with lime accent"><span class="color-swatch" style="--swatch:#a1cf4e"></span><span class="color-name">Lime<small>Slider parallax</small></span></button>
        <button class="color-option" type="button" data-color="#e8846b" data-page="images/vedio.html" aria-label="Open Video demo with peach accent"><span class="color-swatch" style="--swatch:#e8846b"></span><span class="color-name">Peach<small>Video</small></span></button>
        <button class="color-option" type="button" data-color="#9b59b6" data-page="images/video-parallax.html" aria-label="Open Video parallax demo with purple accent"><span class="color-swatch" style="--swatch:#9b59b6"></span><span class="color-name">Purple<small>Video parallax</small></span></button>
        <button class="color-option" type="button" data-color="#00bd9b" data-page="background image.html" aria-label="Open Background image demo with teal accent"><span class="color-swatch" style="--swatch:#00bd9b"></span><span class="color-name">Teal<small>Background image</small></span></button>
      </div>
      <p class="color-status" id="color-status" aria-live="polite">Select a color to open its demo.</p>
      <div class="color-actions">
        <a class="button" href="index.html" style="border-color:var(--line)">Cancel</a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const colorOptions = Array.from(document.querySelectorAll('.color-option'));
      colorOptions.forEach((option) => {
        option.addEventListener('click', () => {
          const color = option.dataset.color;
          const targetPage = option.dataset.page;
          localStorage.setItem('selectedColor', color);
          localStorage.setItem('nextPage', targetPage);
          window.location.href = targetPage;
        });
      });
    })();
  </script>
</body>
</html>
